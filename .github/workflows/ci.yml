name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install "ruff>=0.8"

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          TRACE_BACKEND: local
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t autonomous-sre-orchestrator .
          docker build -t autonomous-sre-victim ./victim_app
      - name: Boot orchestrator and check health
        run: |
          docker run -d --name orch -p 8000:8000 autonomous-sre-orchestrator
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs orch
          exit 1
